name: Android-APK bauen

# Baut bei jedem Push eine installierbare APK und hängt sie an ein GitHub-Release.
# Download aufs Handy: https://github.com/linusthw43-spec/Wetten-app-mit-freunden/releases/latest

on:
  push:
    branches: [ccr-7f0812d1-hjergy, main]
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Öffentliche Werte: der Publishable Key ist dafür gedacht, in der App zu stecken.
  # Geschützt werden die Daten durch die RLS-Regeln in Supabase.
  EXPO_PUBLIC_SUPABASE_URL: https://zjwthumvtvesslynfuux.supabase.co
  EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_Ndc3xd1FDW2pguxpp3K3vg_qWMkSMc2
  ANDROID_VERSION_CODE: ${{ github.run_number }}
  EXPO_NO_TELEMETRY: 1
  # Test-Werkzeuge (z. B. "Pro simulieren") in der Test-APK einblenden
  EXPO_PUBLIC_TEST_TOOLS: 1

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Typecheck & Lint
        run: |
          npx tsc --noEmit
          npx expo lint

      - name: Android-Projekt erzeugen
        run: npx expo prebuild --platform android --no-install

      - name: APK bauen
        working-directory: android
        # Nur arm64 (praktisch alle Handys seit 2019), halbiert die Build-Zeit.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk wett-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: wett-app-apk
          path: wett-app.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Test-Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: wett-app.apk
          body: |
            Test-APK zu Commit ${{ github.sha }}.
            Auf dem Handy herunterladen, öffnen und installieren.
            Ggf. „Installation aus unbekannten Quellen“ für den Browser erlauben.
